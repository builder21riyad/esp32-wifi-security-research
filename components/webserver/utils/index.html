<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ESP32 Management AP</title>
    <style>
        body { width: fit-content; }
        table, tr, th { border: 1px solid; border-collapse: collapse; text-align: center; }
        th, td { padding:10px; }
        tr:hover, tr.selected { background-color: lightblue; cursor:pointer; }
    </style>
</head>
<body onLoad="getStatus()">
    <h1>ESP32 Wi-Fi Penetration Tool</h1>
    <section id="errors"></section>
    <section id="loading">Loading... Please wait</section>
    <section id="ready" style="display: none;">
        <h2>Attack configuration</h2>
        <form onSubmit="runAttack(); return false;">
            <fieldset>
                <legend>Select target</legend>
                <table id="ap-list"></table>
                <p><button type="button" onClick="refreshAps()">Refresh</button></p>
            </fieldset>
            <fieldset>
                <legend>Attack configuration</legend>
                <p>
                    <label for="attack_type">Attack type:</label>
                    <select id="attack_type" onChange="updateConfigurableFields(this)" required>
                        <option value="1">ATTACK_TYPE_HANDSHAKE</option>
                        <option value="2" selected>ATTACK_TYPE_PMKID</option>
                        <option value="3">ATTACK_TYPE_DOS</option>
                    </select>
                </p>
                <p>
                    <label for="attack_method">Attack method:</label>
                    <select id="attack_method" required disabled>
                        <option value="" selected disabled hidden>NOT AVAILABLE</option>
                    </select>
                </p>
                <p>
                    <label for="attack_timeout">Attack timeout (seconds):</label>
                    <input type="number" min="0" id="attack_timeout" value="" required/>
                </p>
                <p><button>Attack</button></p>
            </fieldset>
        </form>
    </section>
    <section id="running" style="display: none;">
        Time elapsed: <span id="running-progress"></span>
    </section>
    <section id="result" style="display: none;">
        <div id="result-meta">Loading result.. Please wait</div>
        <div id="result-content"></div>
        <button type="button" onClick="resetAttack()">New attack</button>
    </section>
    <script>
    var AttackStateEnum = { READY: 0, RUNNING: 1, FINISHED: 2, TIMEOUT: 3};
    var AttackTypeEnum = { ATTACK_TYPE_HANDSHAKE: 1, ATTACK_TYPE_PMKID: 2, ATTACK_TYPE_DOS: 3};
    var selectedApElement = -1;
    var poll_interval = 1000;
    var running_poll;
    var running_poll_interval = 1000;
    var attack_timeout = 0;
    var time_elapsed = 0;
    var defaultResultContent = document.getElementById("result").innerHTML;
    var defaultAttackMethods = document.getElementById("attack_method").outerHTML;

    function getStatus() {
        var oReq = new XMLHttpRequest();
        oReq.onload = function() {
            var arrayBuffer = oReq.response;
            if(arrayBuffer) {
                var attack_state = parseInt(new Uint8Array(arrayBuffer, 0, 1));
                var attack_type = parseInt(new Uint8Array(arrayBuffer, 1, 1));
                var attack_content_size = parseInt(new Uint16Array(arrayBuffer, 2, 1));
                var attack_content = new Uint8Array(arrayBuffer, 4);
                hideAllSections();
                switch(attack_state) {
                    case AttackStateEnum.READY: showAttackConfig(); break;
                    case AttackStateEnum.RUNNING: showRunning(); setTimeout(getStatus, poll_interval); break;
                    case AttackStateEnum.FINISHED: showResult("FINISHED", attack_type, attack_content_size, attack_content); break;
                    case AttackStateEnum.TIMEOUT: showResult("TIMEOUT", attack_type, attack_content_size, attack_content); break;
                }
            }
        };
        oReq.open("GET", "http://192.168.4.1/status", true);
        oReq.responseType = "arraybuffer";
        oReq.send();
    }

    function runAttack() {
        if(selectedApElement == -1) return;
        hideAllSections();
        document.getElementById("running").style.display = "block";
        
        // CHANGED: Create a 7-byte buffer (1+1+1+4) and use DataView for the 32-bit timeout
        var arrayBuffer = new ArrayBuffer(7);
        var view = new DataView(arrayBuffer);
        view.setUint8(0, parseInt(selectedApElement.id));
        view.setUint8(1, parseInt(document.getElementById("attack_type").value));
        view.setUint8(2, parseInt(document.getElementById("attack_method").value));
        view.setUint32(3, parseInt(document.getElementById("attack_timeout").value), true); // true for little-endian
        
        var oReq = new XMLHttpRequest();
        oReq.open("POST", "http://192.168.4.1/run-attack", true);
        oReq.send(arrayBuffer);
        
        getStatus();
        attack_timeout = parseInt(document.getElementById("attack_timeout").value);
        time_elapsed = 0;
        running_poll = setInterval(countProgress, running_poll_interval);
    }

    function countProgress(){
        document.getElementById("running-progress").innerHTML = time_elapsed + "/" + attack_timeout + "s";
        time_elapsed++;
    }

    function hideAllSections(){ for(let s of document.getElementsByTagName("section")) s.style.display = "none"; }
    function showRunning(){ hideAllSections(); document.getElementById("running").style.display = "block"; }
    function showAttackConfig(){ document.getElementById("ready").style.display = "block"; refreshAps(); }
    function resetAttack(){ hideAllSections(); showAttackConfig(); var oReq = new XMLHttpRequest(); oReq.open("HEAD", "http://192.168.4.1/reset", true); oReq.send(); }
    function uint8ToHex(uint8){ return ("00" + uint8.toString(16)).slice(-2); }

    function refreshAps() {
        var oReq = new XMLHttpRequest();
        oReq.onload = function() {
            document.getElementById("ap-list").innerHTML = "<th>SSID</th><th>BSSID</th><th>RSSI</th>";
            var buffer = oReq.response;
            if(buffer) {
                var bytes = new Uint8Array(buffer);
                for (let i = 0; i < bytes.byteLength; i += 40) {
                    var tr = document.createElement('tr');
                    tr.id = i / 40;
                    tr.onclick = function(){ selectAp(this); };
                    var s = new TextDecoder().decode(bytes.subarray(i, i+32));
                    var b = ""; for(let j=0; j<6; j++) b += uint8ToHex(bytes[i+33+j]) + ":";
                    tr.innerHTML = "<td>"+s+"</td><td>"+b+"</td><td>"+(bytes[i+39]-255)+"</td>";
                    document.getElementById("ap-list").appendChild(tr);
                }
            }
        };
        oReq.open("GET", "http://192.168.4.1/ap-list", true);
        oReq.responseType = "arraybuffer";
        oReq.send();
    }

    function selectAp(el) {
        if(selectedApElement != -1) selectedApElement.classList.remove("selected");
        selectedApElement = el; el.classList.add("selected");
    }

    function updateConfigurableFields(el){
        document.getElementById("attack_method").outerHTML = defaultAttackMethods;
        switch(parseInt(el.value)){
            case AttackTypeEnum.ATTACK_TYPE_HANDSHAKE:
                document.getElementById("attack_timeout").value = 600; // Updated default
                setAttackMethods(["DEAUTH_ROGUE_AP (PASSIVE)", "DEAUTH_BROADCAST (ACTIVE)", "CAPTURE_ONLY (PASSIVE)"]);
                break;
            case AttackTypeEnum.ATTACK_TYPE_PMKID:
                document.getElementById("attack_timeout").value = 300; // Updated default
                break;
            case AttackTypeEnum.ATTACK_TYPE_DOS:
                document.getElementById("attack_timeout").value = 3600; // 1 hour default
                setAttackMethods(["DEAUTH_ROGUE_AP (PASSIVE)", "DEAUTH_BROADCAST (ACTIVE)", "DEAUTH_COMBINE_ALL"]);
                break;
        }
    }

    function setAttackMethods(methods){
        var select = document.getElementById("attack_method");
        select.removeAttribute("disabled");
        methods.forEach(function(m, i){
            var o = document.createElement("option"); o.value = i; o.text = m; o.selected = true;
            select.appendChild(o);
        });
    }

    function showResult(status, type, size, content){
        hideAllSections();
        document.getElementById("result").innerHTML = defaultResultContent;
        document.getElementById("result").style.display = "block";
        document.getElementById("result-meta").innerHTML = status + " - " + type;
    }
    </script>
</body>
</html>
